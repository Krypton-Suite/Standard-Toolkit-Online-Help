name: Build and Deploy DocFX Documentation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Enable long path support on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          path: Standard-Toolkit-Online-Help
          fetch-depth: 0

      - name: Checkout Standard-Toolkit
        uses: actions/checkout@v4
        with:
          repository: Krypton-Suite/Standard-Toolkit
          path: Standard-Toolkit

      - name: Checkout Extended-Toolkit
        uses: actions/checkout@v4
        with:
          repository: Krypton-Suite/Extended-Toolkit
          path: Extended-Toolkit

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Toolkit restore under the dotnet CLI includes net11.0-windows (NETSDK1045 on the 10 SDK).
      # Stable 11.0.x may be unpublished before GA; fall back to the preview band.
      - name: Setup .NET 11 (stable)
        id: setup_dotnet11_stable
        continue-on-error: true
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Setup .NET 11 (preview fallback)
        if: steps.setup_dotnet11_stable.outcome == 'failure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Show installed SDKs
        run: dotnet --list-sdks

      # Sibling checkouts (Standard-Toolkit, Extended-Toolkit) walk up to the workspace root.
      - name: Pin SDK via global.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-ListedSdkVersion([string]$Pattern) {
            $hit = dotnet --list-sdks | Select-String $Pattern | Select-Object -Last 1
            if (-not $hit) { return $null }
            $line = $hit.Line.TrimEnd()
            if ($line -match '^(\d+\.\d+\.\d+)\s') { return $Matches[1] }
            return (($line -split '\s+', 2)[0])
          }
          $sdkVersion = Get-ListedSdkVersion '11\.0'
          if (-not $sdkVersion) {
            Write-Error 'No 11.0 SDK is installed. DocFX restore of net11.0-windows projects requires it.'
          }
          Write-Host "Using SDK $sdkVersion"
          $globalJson = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          @"
          {
            "sdk": {
              "version": "$sdkVersion",
              "rollForward": "latestFeature",
              "allowPrerelease": true
            }
          }
          "@ | Out-File -Encoding utf8 $globalJson
          Write-Host "Wrote $globalJson"

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build Documentation
        run: |
          cd Standard-Toolkit-Online-Help/Source/Help/DocFX
          .\build-docfx.ps1
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Standard-Toolkit-Online-Help/Source/Help/Output

  deploy:
    # Only deploy on push to main/master branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4