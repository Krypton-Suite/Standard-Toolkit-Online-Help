name: Validate DocFX Documentation

# Validates DocFX against toolkit branch tips (master, alpha, V105-LTS).
# Published NuGet-aligned trees are deployed by publish-docs-version.yml.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            slug: master
          - branch: alpha
            slug: alpha
          - branch: V105-LTS
            slug: v105-lts

    steps:
      - name: Enable long path support on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          path: Standard-Toolkit-Online-Help

      - name: Checkout Standard-Toolkit (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          repository: Krypton-Suite/Standard-Toolkit
          ref: ${{ matrix.branch }}
          path: Standard-Toolkit

      - name: Checkout Extended-Toolkit (${{ matrix.branch }})
        uses: actions/checkout@v4
        with:
          repository: Krypton-Suite/Extended-Toolkit
          ref: ${{ matrix.branch }}
          path: Extended-Toolkit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build API docs (${{ matrix.branch }})
        shell: pwsh
        run: |
          & "Standard-Toolkit-Online-Help/Scripts/Build-VersionedDocs.ps1" `
            -Branch "${{ matrix.branch }}" `
            -OutputRoot (Join-Path $env:GITHUB_WORKSPACE "site") `
            -UseSiblings `
            -SkipClone

      - name: Verify output
        shell: pwsh
        run: |
          $index = Join-Path $env:GITHUB_WORKSPACE "site\v\${{ matrix.slug }}\index.html"
          if (-not (Test-Path $index)) {
            Write-Host "::error::Missing $index"
            Get-ChildItem -Force (Join-Path $env:GITHUB_WORKSPACE "site") -Recurse -Depth 3 |
              Select-Object -First 80 FullName
            exit 1
          }
          Write-Host "OK: $index"
